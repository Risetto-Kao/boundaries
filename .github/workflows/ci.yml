name: Frontend checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: boundaries_forms_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d boundaries_forms_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-only placeholders. Functional checks use the isolated CI service.
      DATABASE_URL: postgresql://localhost:5432/boundaries
      DIRECT_URL: postgresql://localhost:5432/boundaries
      BOUNDARIES_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-password@127.0.0.1:5432/boundaries_forms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:auth
      - run: pnpm test:i18n
      - run: pnpm test:design
      - run: pnpm test:forms
      - run: pnpm test:form-tokens
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
